name: Catalog snapshot

# Weekly rebuild of the committed catalog from transport.data.gouv.fr, merged via a PR once tests pass.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm catalog
      - run: pnpm test
      - id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/catalog-snapshot
          commit-message: 'chore(catalog): refresh network snapshot'
          title: 'chore(catalog): refresh network snapshot'
          body: Weekly rebuild of `packages/gbfs-core/data/catalog.json` from transport.data.gouv.fr.
          add-paths: |
            packages/gbfs-core/data/catalog.json
            README.md
            README.fr.md
      # Tests above gate the merge; main has no required checks, so merge directly.
      - if: contains(fromJSON('["created","updated"]'), steps.pr.outputs.pull-request-operation)
        run: gh pr merge ${{ steps.pr.outputs.pull-request-number }} --squash --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
