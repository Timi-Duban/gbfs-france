name: Release

# Push a tag `vX.Y.Z` matching apps/mcp/package.json. The first npm publish is manual; then
# configure npm trusted publishing (this repo + release.yml) so no npm token is stored.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (provenance) and MCP registry OIDC login
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Tag matches package version
        run: test "v$(node -p "require('./apps/mcp/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: ./.github/actions/mcp-publisher
      - run: mcp-publisher validate server.json
        working-directory: apps/mcp
      # pnpm pack rewrites workspace: ranges; npm publishes the tarball through OIDC.
      # Skipped when the version is already on npm, so a rerun can finish the registry step.
      - name: Publish to npm
        working-directory: apps/mcp
        run: |
          if npm view "gbfs-france-mcp@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then exit 0; fi
          pnpm pack --out package.tgz
          npm publish package.tgz --provenance --access public
      # npm processes new versions for a few minutes; the MCP registry checks the version exists.
      - name: Wait for the version on npm
        run: |
          for _ in $(seq 60); do
            npm view "gbfs-france-mcp@${GITHUB_REF_NAME#v}" version --prefer-online >/dev/null 2>&1 && exit 0
            sleep 15
          done
          exit 1
      - run: mcp-publisher login github-oidc
      - run: mcp-publisher publish
        working-directory: apps/mcp
