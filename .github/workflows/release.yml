name: Release

# Tag `vX.Y.Z` = apps/mcp version. Publishes via npm trusted publishing (OIDC, no token).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (provenance) and MCP registry OIDC login
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Tag matches package version
        run: test "v$(node -p "require('./apps/mcp/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: ./.github/actions/mcp-publisher
      - run: mcp-publisher validate server.json
        working-directory: apps/mcp
      # pnpm pack rewrites workspace: ranges; skipped if already published, so reruns work.
      - name: Publish to npm
        working-directory: apps/mcp
        run: |
          if npm view "gbfs-france-mcp@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then exit 0; fi
          pnpm pack --out package.tgz
          npm publish package.tgz --provenance --access public
      # The MCP registry rejects versions npm has not finished processing.
      - name: Wait for the version on npm
        run: |
          for _ in $(seq 60); do
            npm view "gbfs-france-mcp@${GITHUB_REF_NAME#v}" version --prefer-online >/dev/null 2>&1 && exit 0
            sleep 15
          done
          exit 1
      - run: mcp-publisher login github-oidc
      - run: mcp-publisher publish
        working-directory: apps/mcp
